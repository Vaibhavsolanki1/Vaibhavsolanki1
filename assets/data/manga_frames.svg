<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Halftone Manga Dot Screen Pattern -->
    <pattern id="mangaHalftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#E94560" fill-opacity="0.15"/>
    </pattern>
    <!-- Screentone Grid Pattern -->
    <pattern id="mangaScreenGrid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Frame Corner Accents (Manga Panel Borders) -->
  <g stroke="#E94560" stroke-width="3" fill="none">
    <path d="M12 40 L12 12 L40 12"/>
    <path d="M788 40 L788 12 L760 12"/>
    <path d="M12 360 L12 388 L40 388"/>
    <path d="M788 360 L788 388 L760 388"/>
  </g>
</svg>

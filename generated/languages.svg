<path d="M 86.66 129.58 A 65.00 65.00 0 0 1 99.14 74.52 L 117.14 88.84 A 42.00 42.00 0 0 0 109.07 124.42 Z" fill="#3178C6"><title>TypeScript: 14.3%</title></path>
